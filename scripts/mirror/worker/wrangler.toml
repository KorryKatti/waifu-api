name = "waifu-cdn"
main = "worker.js"
compatibility_date = "2026-10-06"

# Deploy with:  npx wrangler deploy
# The URL printed (something.workers.dev) is what goes in Cdn__BaseUrl.

[vars]
S3_ENDPOINT = "https://t3.storage.dev"
S3_REGION = "auto"
S3_BUCKET = "waifu-api"
API_ORIGIN = "https://waifu-api-031n.onrender.com"

# Kill switch for the .png -> .webp mapping in worker.js. Set to "false"
# and redeploy to restore plain .png -> .png, touching nothing else.
WEBP_FALLBACK = "true"

# Separate kill switch for .jpeg/.jpg -> .webp.
#
# Deliberately not folded into WEBP_FALLBACK. The .png path is deployed and
# serving traffic; the .jpeg path is new. One flag would mean reverting the new
# behaviour also silently reverts the working one.
WEBP_JPEG_FALLBACK = "true"

# Secrets are NOT set here on purpose. Set them with:
#   npx wrangler secret put S3_ACCESS_KEY_ID
#   npx wrangler secret put S3_SECRET_ACCESS_KEY