name = "waifu-cdn"
main = "worker.js"
compatibility_date = "2026-10-06"

# Deploy with:  npx wrangler deploy
# The URL printed (something.workers.dev) is what goes in Cdn__BaseUrl.

[vars]
S3_ENDPOINT = "https://s3.ap-northeast-1.idrivee2.com"
S3_REGION = "ap-northeast-1"
S3_BUCKET = "waifu-images"
API_ORIGIN = "https://waifu-api-031n.onrender.com"

# Secrets are NOT set here on purpose. Set them with:
#   npx wrangler secret put S3_ACCESS_KEY_ID
#   npx wrangler secret put S3_SECRET_ACCESS_KEY