name: Deploy Documentation

on:
  push:
    # Trigger ONLY on version tags
    tags: [ 'v*.*.*' ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_URL: ${{ vars.DOCS_URL || 'https://docs.waifu.im' }}
  DOCS_BASE_URL: /
  DOCS_ORG_NAME: ${{ vars.DOCS_ORG_NAME || 'Waifu-im' }}
  DOCS_PROJECT_NAME: waifu-api
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.waifu.im' }}
  APP_NAME: ${{ vars.APP_NAME || 'Waifu.im' }}
  APP_TAGLINE: "The API for your Waifu content. Access thousands of categorized anime illustrations via our robust REST API or browse freely."
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://www.waifu.im' }}
  GITHUB_URL: ${{ vars.GITHUB_URL || 'https://github.com/Waifu-im/waifu-api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      # The OpenAPI spec is checked in at openapi/WaifuApi.Web.json and read by
      # docs/docusaurus.config.ts. Regenerating it is a deliberate act, not part
      # of a docs deploy.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate API docs from OpenAPI spec
        working-directory: docs
        run: npx docusaurus gen-api-docs all

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
